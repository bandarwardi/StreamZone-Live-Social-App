kind = "mobile"
previewPath = "/streamzone/"
title = "StreamZone Live Social App"
description = "A frontend-only Expo prototype for a live streaming social app with discover, live rooms, PK battles, voice rooms, profile, wallet, and messaging experiences powered by local mock state."
version = "1.0.0"
id = "artifacts/streamzone"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/streamzone/" ]
localPort = 20328

[services.development]
run = "pnpm --filter @workspace/streamzone run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/streamzone", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/streamzone", "run", "serve" ]

[services.env]
PORT = "20328"
BASE_PATH = "/streamzone/"
